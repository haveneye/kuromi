<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>쿠로미와 함께하는 학습 습관</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
        
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #fce7f3;
            touch-action: manipulation;
        }
        
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        
        .bg-kuromi-light { background-color: #f5f3ff; }
        .bg-kuromi-card { background-color: #ffffff; }
        .border-kuromi { border-color: #c084fc; }
        .text-kuromi { color: #7e22ce; }
        .bg-kuromi-btn { background-color: #a855f7; }
        .bg-kuromi-btn:hover { background-color: #9333ea; }
        
        .bounce-short {
            animation: bounce 0.6s ease infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #c084fc; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-12 text-gray-800 select-none">

    <!-- Top Navigation / Header -->
    <header class="bg-purple-900 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <!-- Kuromi Mini Logo SVG -->
                <svg class="w-8 h-8 fill-current text-pink-400" viewBox="0 0 100 100">
                    <path d="M50 15 C30 15 15 30 15 50 C15 70 30 85 50 85 C70 85 85 70 85 50 C85 30 70 15 50 15 Z" fill="#2e1065"/>
                    <path d="M25 25 L10 5 L35 20 Z" fill="#2e1065"/>
                    <path d="M75 25 L90 5 L65 20 Z" fill="#2e1065"/>
                    <circle cx="38" cy="48" r="5" fill="#ffffff"/>
                    <circle cx="62" cy="48" r="5" fill="#ffffff"/>
                    <circle cx="39" cy="49" r="2" fill="#000000"/>
                    <circle cx="61" cy="49" r="2" fill="#000000"/>
                    <path d="M47 62 Q50 67 53 62" stroke="#f472b6" stroke-width="3" fill="none"/>
                    <path d="M50 32 L54 38 L60 38 L55 42 L57 48 L50 44 L43 48 L45 42 L40 38 L46 38 Z" fill="#f472b6"/>
                </svg>
                <h1 class="font-jua text-xl tracking-wide text-pink-300">쿠로미 습관매니저</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- DB Config Button -->
                <button onclick="openDbConfigModal()" class="bg-purple-800 text-pink-200 text-xs px-2.5 py-1.5 rounded-lg border border-purple-600 font-jua hover:bg-purple-700">
                    ⚙️ DB연동
                </button>
                <!-- Parent Mode Toggle -->
                <button id="parentToggleBtn" onclick="toggleParentMode()" class="bg-purple-800 text-xs px-2.5 py-1.5 rounded-lg border border-purple-600 font-jua text-pink-200">
                    👨‍👩‍👧 부모모드: OFF
                </button>
            </div>
        </div>
    </header>

    <!-- Realtime Connection Status Bar -->
    <div id="dbStatusBanner" class="bg-yellow-100 text-yellow-800 text-xs text-center py-1 px-2 font-medium border-b border-yellow-200">
        ⚠️ 로컬 모드 사용 중 (⚙️ DB연동 버튼을 눌러 파이어베이스 값을 입력하면 엄마/아빠 폰과 실시간 연결됩니다)
    </div>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Active Profile Card -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border-2 border-purple-200 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div id="profileAvatar" class="w-12 h-12 rounded-full bg-purple-100 border-2 border-purple-300 flex items-center justify-center text-2xl shadow-inner">
                    😈
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span id="profileName" class="font-jua text-lg text-purple-950">프로필 선택 필요</span>
                        <button onclick="openProfileSelector()" class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full hover:bg-purple-200 font-bold">변경</button>
                    </div>
                    <p class="text-xs text-gray-500" id="profileSubText">4자리 PIN으로 안전하게 보호됨</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-xs text-purple-600 font-bold block">보유 포인트</span>
                <span id="userPoints" class="font-jua text-2xl text-purple-700">0 P</span>
            </div>
        </section>

        <!-- Parent Control Banner -->
        <section id="parentNoticeBox" class="hidden bg-purple-900 text-white p-3 rounded-xl text-xs space-y-1 shadow-md border-2 border-pink-400">
            <div class="flex justify-between items-center">
                <span class="font-bold text-pink-300 text-sm">👑 부모님 실시간 관리 모드 활성화</span>
                <span class="bg-pink-500 text-white text-[10px] px-1.5 py-0.5 rounded">실시간 수정 중</span>
            </div>
            <p class="text-purple-200">할 일을 직접 추가/삭제하거나 포인트를 임의로 보상할 수 있습니다.</p>
        </section>

        <!-- Tabs Navigation -->
        <div class="flex bg-purple-200 p-1 rounded-xl font-jua text-sm text-purple-800">
            <button id="tabBtn1" onclick="switchTab('habits')" class="flex-1 py-2 rounded-lg bg-white shadow text-purple-900 font-bold text-center">
                📝 오늘 할 일
            </button>
            <button id="tabBtn2" onclick="switchTab('shop')" class="flex-1 py-2 rounded-lg text-center hover:bg-white/50">
                🛍️ 캐릭터 샵
            </button>
            <button id="tabBtn3" onclick="switchTab('calendar')" class="flex-1 py-2 rounded-lg text-center hover:bg-white/50">
                📅 학습 달력
            </button>
        </div>

        <!-- TAB 1: HABITS & TASKS -->
        <section id="tab-habits" class="space-y-3">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-purple-100 space-y-2">
                <div class="flex gap-2">
                    <input type="text" id="newTaskInput" placeholder="새로운 공부나 할 일 입력..." class="flex-1 bg-purple-50 border border-purple-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-purple-500">
                    <div class="flex items-center bg-purple-50 border border-purple-200 rounded-xl px-2">
                        <input type="number" id="newTaskPoints" value="10" min="1" max="100" class="w-10 bg-transparent text-center text-sm font-bold text-purple-700 focus:outline-none">
                        <span class="text-xs text-purple-500 font-bold pr-1">P</span>
                    </div>
                    <button onclick="addNewTask()" class="bg-purple-600 text-white px-4 py-2 rounded-xl font-jua text-sm hover:bg-purple-700 shadow-sm">
                        추가
                    </button>
                </div>
                <!-- Preset Buttons -->
                <div class="flex flex-wrap gap-1.5 pt-1">
                    <span class="text-[11px] text-gray-400 self-center mr-1">추천:</span>
                    <button onclick="addPresetTask('학교/학원 숙제하기', 10)" class="text-xs bg-pink-50 text-pink-600 px-2 py-1 rounded-lg border border-pink-200 hover:bg-pink-100">+ 숙제 10P</button>
                    <button onclick="addPresetTask('책 20분 읽기', 15)" class="text-xs bg-purple-50 text-purple-600 px-2 py-1 rounded-lg border border-purple-200 hover:bg-purple-100">+ 독서 15P</button>
                    <button onclick="addPresetTask('일기 쓰기', 10)" class="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded-lg border border-indigo-200 hover:bg-indigo-100">+ 일기 10P</button>
                    <button onclick="addPresetTask('방 정리하기', 5)" class="text-xs bg-green-50 text-green-600 px-2 py-1 rounded-lg border border-green-200 hover:bg-green-100">+ 정리 5P</button>
                </div>
            </div>

            <!-- Task List -->
            <div id="taskList" class="space-y-2">
                <!-- Dynamic tasks injected here -->
            </div>
        </section>

        <!-- TAB 2: CHARACTER SHOP -->
        <section id="tab-shop" class="hidden space-y-3">
            <div class="bg-purple-100 p-3 rounded-xl text-xs text-purple-800 border border-purple-200 text-center font-medium">
                ✨ 할 일을 완료해서 모은 포인트로 귀여운 산리오 친구들을 해금하세요!
            </div>
            <div id="shopGrid" class="grid grid-cols-2 gap-3">
                <!-- Dynamic character cards injected here -->
            </div>
        </section>

        <!-- TAB 3: CALENDAR & LOGS -->
        <section id="tab-calendar" class="hidden space-y-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-purple-100 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-jua text-purple-900 text-base">📅 이번 달 학습 현황</h3>
                    <span id="currentMonthStr" class="text-xs font-bold text-purple-600">진행 중</span>
                </div>
                
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-gray-400 pb-1">
                    <div class="text-red-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-400">토</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs">
                    <!-- Dynamic calendar days injected here -->
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-purple-100 space-y-2">
                <h4 class="font-jua text-sm text-purple-900">🏆 오늘의 습관 완성도</h4>
                <div class="w-full bg-gray-100 h-4 rounded-full overflow-hidden border border-gray-200">
                    <div id="progressBar" class="bg-gradient-to-r from-pink-400 to-purple-600 h-
