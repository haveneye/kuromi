<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>쿠로미 학습 습관 매니저</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
        
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #fce7f3;
            touch-action: manipulation;
        }
        
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        
        .bg-kuromi-card { background-color: #ffffff; }
        .border-kuromi { border-color: #f472b6; }
        .text-kuromi { color: #8b5cf6; }
        .bg-kuromi-btn { background-color: #c084fc; }
        .bg-kuromi-btn:hover { background-color: #a855f7; }
        
        .bounce-short {
            animation: bounce 0.6s ease infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-12 text-gray-800 select-none bg-pink-100">

    <!-- Top Header -->
    <header class="bg-purple-900 text-white p-4 shadow-md sticky top-0 z-30 border-b-4 border-pink-300">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <!-- Sanrio / Kuromi Graphic SVG -->
                <svg class="w-9 h-9" viewBox="0 0 100 100">
                    <path d="M50 15 C30 15 15 30 15 50 C15 70 30 85 50 85 C70 85 85 70 85 50 C85 30 70 15 50 15 Z" fill="#3b0764"/>
                    <path d="M22 22 L8 2 L32 18 Z" fill="#3b0764"/>
                    <path d="M78 22 L92 2 L68 18 Z" fill="#3b0764"/>
                    <circle cx="36" cy="48" r="6" fill="#ffffff"/>
                    <circle cx="64" cy="48" r="6" fill="#ffffff"/>
                    <circle cx="37" cy="49" r="2.5" fill="#000000"/>
                    <circle cx="63" cy="49" r="2.5" fill="#000000"/>
                    <path d="M46 62 Q50 67 54 62" stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M50 30 L54 36 L60 36 L55 40 L57 46 L50 42 L43 46 L45 40 L40 36 L46 36 Z" fill="#f472b6"/>
                </svg>
                <h1 class="font-jua text-2xl tracking-wide text-pink-200 drop-shadow">쿠로미 습관매니저</h1>
            </div>
            
            <div class="flex items-center space-x-1.5">
                <button onclick="openDbConfigModal()" class="bg-purple-800 text-pink-200 text-xs px-2 py-1.5 rounded-xl border border-pink-400/50 hover:bg-purple-700 font-jua">
                    ⚙️ DB연동
                </button>
                <button id="parentToggleBtn" onclick="toggleParentMode()" class="bg-pink-500 text-white text-xs px-2.5 py-1.5 rounded-xl font-jua shadow hover:bg-pink-600">
                    👨‍👩‍👧 부모모드
                </button>
            </div>
        </div>
    </header>

    <!-- DB Status Banner -->
    <div id="dbStatusBanner" class="bg-pink-200 text-purple-900 text-xs text-center py-1.5 px-2 font-bold border-b border-pink-300">
        ⚠️ 데이터베이스 미연동 상태 (⚙️ DB연동 버튼을 눌러 설정값을 넣으면 실시간 연결됩니다)
    </div>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Active Profile Card -->
        <section class="bg-white rounded-3xl p-4 shadow-lg border-2 border-purple-200 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div id="profileAvatar" class="w-14 h-14 rounded-full bg-purple-100 border-2 border-pink-300 flex items-center justify-center text-3xl shadow-inner">
                    😈
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <span id="profileName" class="font-jua text-xl text-purple-950">프로필</span>
                        <button onclick="openProfileSelector()" class="text-xs bg-pink-100 text-pink-600 font-bold px-2 py-0.5 rounded-full hover:bg-pink-200">변경</button>
                    </div>
                    <p class="text-[11px] text-purple-400 font-medium" id="profileSubText">4자리 PIN 보호 중 🔒</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-xs text-purple-500 font-bold block">내 포인트</span>
                <span id="userPoints" class="font-jua text-3xl text-purple-700 drop-shadow-sm">0 P</span>
            </div>
        </section>

        <!-- Parent Notice Banner -->
        <section id="parentNoticeBox" class="hidden bg-purple-900 text-white p-3 rounded-2xl text-xs space-y-1 shadow-md border-2 border-pink-300">
            <div class="flex justify-between items-center">
                <span class="font-jua text-pink-300 text-sm">👑 부모님 실시간 관리 모드</span>
                <span class="bg-pink-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">수정 가능</span>
            </div>
            <p class="text-purple-200">할 일을 자유롭게 추가/삭제하거나 완수 여부를 대신 체크할 수 있습니다.</p>
        </section>

        <!-- Tabs Navigation -->
        <div class="flex bg-purple-200 p-1.5 rounded-2xl font-jua text-base shadow-inner text-purple-800">
            <button id="tabBtn1" onclick="switchTab('habits')" class="flex-1 py-2 rounded-xl bg-white shadow text-purple-900 font-bold text-center transition-all">
                📝 오늘 할 일
            </button>
            <button id="tabBtn2" onclick="switchTab('shop')" class="flex-1 py-2 rounded-xl text-center hover:bg-white/50 transition-all">
                🛍️ 캐릭터 샵
            </button>
            <button id="tabBtn3" onclick="switchTab('calendar')" class="flex-1 py-2 rounded-xl text-center hover:bg-white/50 transition-all">
                📅 학습 달력
            </button>
