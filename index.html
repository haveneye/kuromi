<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산리오 학습 습관 매니저</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
        body { font-family: 'Gowun Dodum', sans-serif; background-color: #fdf2f8; }
        .font-jua { font-family: 'Jua', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 min-h-screen text-gray-800 pb-10">

    <!-- Header -->
    <header class="bg-purple-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-jua text-xl flex items-center gap-2">
                <span>🌸</span> 지우의 산리오 습관장
            </h1>
            <button onclick="toggleParentMode()" id="parentBtn" class="bg-purple-700 text-xs px-3 py-1.5 rounded-full font-jua border border-purple-400">
                👤 부모님 모드: OFF
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Profile & Points -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-pink-200 flex justify-between items-center">
            <div>
                <span id="profileName" class="font-jua text-lg text-purple-700">지우</span>
                <p class="text-xs text-gray-400">오늘도 힘내서 포인트를 모아봐요!</p>
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-500 block">내 포인트</span>
                <span id="userPoints" class="font-jua text-2xl text-pink-600">0 P</span>
            </div>
        </section>

        <!-- Tabs -->
        <div class="flex bg-purple-100 p-1 rounded-xl font-jua text-sm text-purple-700">
            <button onclick="switchTab('habits')" id="tabHabits" class="flex-1 py-2 rounded-lg bg-white shadow text-purple-900 font-bold">📝 할 일</button>
            <button onclick="switchTab('shop')" id="tabShop" class="flex-1 py-2 rounded-lg">🛍️ 상점</button>
            <button onclick="switchTab('calendar')" id="tabCalendar" class="flex-1 py-2 rounded-lg">📅 달력</button>
        </div>

        <!-- Tab 1: Habits -->
        <div id="sectionHabits" class="space-y-3">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-pink-100 flex gap-2">
                <input type="text" id="taskInput" placeholder="새로운 할 일 입력..." class="flex-1 bg-pink-50 border border-pink-200 rounded-xl px-3 py-2 text-sm focus:outline-none">
                <button onclick="addTask()" class="bg-purple-600 text-white px-4 rounded-xl font-jua text-sm">추가</button>
            </div>
            <div id="taskList" class="space-y-2"></div>
        </div>

        <!-- Tab 2: Shop -->
        <div id="sectionShop" class="hidden space-y-3">
            <div class="grid grid-cols-2 gap-3" id="shopGrid"></div>
        </div>

        <!-- Tab 3: Calendar -->
        <div id="sectionCalendar" class="hidden bg-white p-4 rounded-2xl shadow-sm border border-pink-100">
            <h3 class="font-jua text-purple-800 mb-2">📅 10월 학습 달력</h3>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
        </div>
    </main>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        // ==========================================
        // 🛠️ 아래 3가지 칸에 아버님의 파이어베이스 값을 넣어주세요!
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBV_rnTIqxLquQAJ2i14S-Lin2y0bCIF3Q",
            databaseURL: "https://kuromi-app-default-rtdb.firebaseio.com",
            projectId: "kuromi-app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let state = {
            points: 0,
            tasks: [
                { id: 1, text: "책 20분 읽기", points: 10, completed: false },
                { id: 2, text: "숙제 다 하기", points: 15, completed: false }
            ],
            unlocked: ['kuromi'],
            activeChar: 'kuromi',
            isParent: false
        };

        const characters = [
            { id: 'kuromi', name: '쿠로미', icon: '😈', cost: 0 },
            { id: 'mymelody', name: '마이멜로디', icon: '🐰', cost: 30 },
            { id: 'cinnamoroll', name: '시나모롤', icon: '🐶', cost: 50 }
        ];

        // Realtime Sync from Firebase
        onValue(ref(db, 'jiwoo_habit_data'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state = data;
                render();
            }
        });

        function save() {
            set(ref(db, 'jiwoo_habit_data'), state);
        }

        window.addTask = function() {
            const input = document.getElementById('taskInput');
            if(!input.value.trim()) return;
            state.tasks.push({ id: Date.now(), text: input.value, points: 10, completed: false });
            input.value = '';
            save();
            render();
        };

        window.toggleTask = function(id) {
            const task = state.tasks.find(t => t.id === id);
            if(task) {
                task.completed = !task.completed;
                state.points += task.completed ? task.points : -task.points;
                if(task.completed) confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                save();
                render();
            }
        };

        window.switchTab = function(tab) {
            ['habits', 'shop', 'calendar'].forEach(t => {
                document.getElementById(`section${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).className = `flex-1 py-2 rounded-lg ${t === tab ? 'bg-white shadow text-purple-900 font-bold' : ''}`;
            });
        };

        window.toggleParentMode = function() {
            state.isParent = !state.isParent;
            document.getElementById('parentBtn').innerText = `👤 부모님 모드: ${state.isParent ? 'ON' : 'OFF'}`;
        };

        function render() {
            document.getElementById('userPoints').innerText = `${state.points} P`;
            
            // Tasks
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = state.tasks.map(t => `
                <div onclick="toggleTask(${t.id})" class="p-3 bg-white rounded-xl border border-pink-100 flex justify-between items-center cursor-pointer shadow-sm">
                    <span class="${t.completed ? 'line-through text-gray-400' : ''}">${t.text}</span>
                    <span class="text-xs bg-pink-100 text-pink-600 px-2 py-1 rounded-full font-bold">+${t.points}P</span>
                </div>
            `).join('');

            // Shop
            document.getElementById('shopGrid').innerHTML = characters.map(c => `
                <div class="bg-white p-3 rounded-2xl text-center border border-pink-100">
                    <div class="text-3xl">${c.icon}</div>
                    <div class="font-jua text-sm mt-1">${c.name}</div>
                    <button class="mt-2 text-xs bg-purple-600 text-white w-full py-1 rounded-lg">${c.cost}P</button>
                </div>
            `).join('');
        }

        render();
    </script>
</body>
</html>
