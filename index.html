<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>쿠로미와 함께하는 학습 습관</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
        
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #fce7f3;
            touch-action: manipulation;
        }
        
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        
        .bounce-short {
            animation: bounce 0.6s ease infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #c084fc; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-12 text-gray-800 select-none">

    <!-- Top Navigation / Header -->
    <header class="bg-purple-900 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <!-- Original Kuromi SVG Logo -->
                <svg class="w-8 h-8" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#a855f7"/>
                    <path d="M30 35 Q50 20 70 35 Q85 60 50 85 Q15 60 30 35 Z" fill="#ffffff"/>
                    <circle cx="40" cy="45" r="5" fill="#000000"/>
                    <circle cx="60" cy="45" r="5" fill="#000000"/>
                    <path d="M45 55 Q50 60 55 55" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M45 28 L50 22 L55 28 Z" fill="#f472b6"/>
                </svg>
                <h1 class="font-jua text-xl tracking-wide text-pink-300">쿠로미 습관매니저</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- DB Config Button -->
                <button onclick="openDbConfigModal()" class="bg-purple-800 text-pink-200 text-xs px-2.5 py-1.5 rounded-lg border border-purple-600 font-jua hover:bg-purple-700">
                    ⚙️ DB연동
                </button>
                <!-- Parent Mode Toggle -->
                <button id="parentToggleBtn" onclick="toggleParentMode()" class="bg-purple-800 text-xs px-2.5 py-1.5 rounded-lg border border-purple-600 font-jua text-pink-200">
                    👨‍👩‍👧 부모모드: OFF
                </button>
            </div>
        </div>
    </header>

    <!-- Realtime Connection Status Bar -->
    <div id="dbStatusBanner" class="bg-yellow-100 text-yellow-800 text-xs text-center py-1 px-2 font-medium border-b border-yellow-200">
        ⚠️ 로컬 모드 사용 중 (⚙️ DB연동 버튼을 눌러 파이어베이스 값을 입력하면 엄마/아빠 폰과 실시간 연결됩니다)
    </div>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Active Profile Card -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border-2 border-purple-200 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div id="profileAvatar" class="w-12 h-12 rounded-full bg-purple-100 border-2 border-purple-300 flex items-center justify-center text-2xl shadow-inner">
                    😈
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span id="profileName" class="font-jua text-lg text-purple-950">프로필 선택 필요</span>
                        <button onclick="openProfileSelector()" class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full hover:bg-purple-200 font
